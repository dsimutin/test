<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>{{ css }}</style>
</head>
<body>
<div class="flashcard irregular-card" style="--accent: {{ accent }}">
  <div class="card-header">
    <div class="label">Irregular Verb</div>
    <div class="number">{{ number }}</div>
  </div>

  <div class="verb-forms">
    <div class="verb-cell">
      <div class="verb-box">{{ infinitive }}</div>
      <div class="verb-label">Infinitive</div>
    </div>
    <div class="verb-cell">
      <div class="verb-box accent">{{ past_simple }}</div>
      <div class="verb-label">Past Simple</div>
    </div>
    <div class="verb-cell">
      <div class="verb-box">{{ past_participle }}</div>
      <div class="verb-label">Participle</div>
    </div>
  </div>

  <div class="verb-dots">
    <div class="dot"></div><div class="line"></div>
    <div class="dot"></div><div class="line"></div>
    <div class="dot"></div>
  </div>

  <div class="translation-block">
    <div class="translation-label">Перевод</div>
    <div class="translation">{{ translation }}</div>
  </div>

  {% if example %}
  <div class="example">
    <span class="quote">"</span>{{ example_html | safe }}
  </div>
  {% endif %}
</div>
</body>
</html>
