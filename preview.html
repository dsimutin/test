<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Study Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F0EDE8;min-height:100vh;padding:40px 24px}
.page{max-width:1260px;margin:0 auto}
.page-title{font-size:32px;font-weight:800;color:#0F172A;letter-spacing:-.03em}
.page-sub{font-size:16px;color:#64748B;margin-top:6px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}

/* ── Card shell ── */
.card{
  background:#fff;
  border-radius:32px;
  padding:32px;
  box-shadow:0 2px 4px rgba(15,23,42,.04),0 12px 32px rgba(15,23,42,.10);
  display:flex;
  flex-direction:column;
  gap:0;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  inset:0 0 auto 0;
  height:5px;
  border-radius:32px 32px 0 0;
  background:var(--accent);
}

/* ── Header row ── */
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}
.card-label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--accent);
}
.card-label-icon{
  width:30px;height:30px;
  border-radius:50%;
  background:color-mix(in srgb,var(--accent) 12%,#fff);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.card-number{
  font-size:13px;font-weight:700;
  padding:5px 12px;
  border-radius:10px;
  background:color-mix(in srgb,var(--accent) 10%,#fff);
  color:var(--accent);
}

/* ── Word block ── */
.card-word{
  font-size:54px;
  font-weight:800;
  color:#0F172A;
  letter-spacing:-.04em;
  line-height:1;
  margin-bottom:14px;
}
.card-accent-line{
  height:2px;
  border-radius:2px;
  background:color-mix(in srgb,var(--accent) 45%,#fff);
  margin-bottom:14px;
}
.card-transcription{
  font-size:24px;
  font-weight:500;
  color:var(--accent);
  margin-bottom:0;
}

/* ── Translation block ── */
.card-translation-row{
  display:flex;
  align-items:center;
  gap:12px;
  border-top:1px solid #E8ECF0;
  border-bottom:1px solid #E8ECF0;
  padding:16px 0;
  margin:20px 0;
}
.card-flag{
  width:38px;height:38px;flex-shrink:0;
  border-radius:50%;
  background:color-mix(in srgb,var(--accent) 10%,#fff);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.card-translation{
  font-size:26px;
  font-weight:600;
  color:#1E293B;
  line-height:1.25;
}

/* ── Verb forms ── */
.verb-forms{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}
.verb-form-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.verb-form-box{
  width:100%;
  padding:14px 8px;
  border-radius:18px;
  background:color-mix(in srgb,var(--accent) 8%,#fff);
  text-align:center;
  font-size:28px;
  font-weight:800;
  color:#0F172A;
  line-height:1;
}
.verb-form-box.accent{
  background:color-mix(in srgb,var(--accent) 13%,#fff);
  color:var(--accent);
}
.verb-form-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#94A3B8;
}

/* ── Dots connector ── */
.dots-row{
  display:flex;
  align-items:center;
  padding:0 10%;
  margin-bottom:4px;
}
.dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);flex-shrink:0;
}
.dot-line{flex:1;height:1px;background:#E2E8F0}

/* ── Example block ── */
.card-example{
  margin-top:auto;
  padding:16px 20px;
  border-radius:20px;
  background:color-mix(in srgb,var(--accent) 7%,#fff);
  font-size:20px;
  line-height:1.55;
  color:#475569;
}
.card-example .quote{
  font-size:28px;
  opacity:.35;
  margin-right:2px;
  font-family:Georgia,serif;
  line-height:1;
  vertical-align:-.1em;
}
.card-example .hl{
  color:var(--accent);
  font-weight:700;
}
</style>
</head>
<body>
<div class="page">
  <div class="page-title">Study Flashcards</div>
  <div class="page-sub">Vocabulary and irregular verb cards for English learning bot.</div>
  <div class="grid" id="grid"></div>
</div>

<script>
const vocabularyCards = [
  {type:"vocabulary",number:"01",word:"improve",transcription:"/ɪmˈpruːv/",translation:"улучшать",example:"I want to improve my speaking.",highlight:"improve",accent:"#2F7D5B"},
  {type:"vocabulary",number:"02",word:"conversation",transcription:"/ˌkɒnvəˈseɪʃən/",translation:"разговор",example:"This conversation is interesting.",highlight:"conversation",accent:"#2F6FD6"},
  {type:"vocabulary",number:"03",word:"stressful",transcription:"/ˈstresfəl/",translation:"стрессовый / напряжённый",example:"My morning is sometimes stressful.",highlight:"stressful",accent:"#7A4FB3"},
];
const irregularVerbCards = [
  {type:"irregular",number:"01",infinitive:"come",pastSimple:"came",pastParticiple:"come",translation:"приходить / приезжать",example:"I came home late.",highlight:"came",accent:"#2F7D5B"},
  {type:"irregular",number:"02",infinitive:"do",pastSimple:"did",pastParticiple:"done",translation:"делать",example:"I did my homework yesterday.",highlight:"did",accent:"#2F6FD6"},
  {type:"irregular",number:"03",infinitive:"get",pastSimple:"got",pastParticiple:"got",translation:"получать / добираться / становиться",example:"I got home at 7.",highlight:"got",accent:"#7A4FB3"},
];

function hl(text, word, accent) {
  const re = new RegExp(`(\\b${word}\\b)`,'gi');
  return text.replace(re,`<span class="hl" style="color:${accent}">$1</span>`);
}

function vocabCard(c) {
  return `<div class="card" style="--accent:${c.accent}">
    <div class="card-header">
      <div class="card-label">
        <div class="card-label-icon">📖</div>
        VOCABULARY
      </div>
      <div class="card-number">${c.number}</div>
    </div>
    <div class="card-word">${c.word}</div>
    <div class="card-accent-line"></div>
    <div class="card-transcription">${c.transcription}</div>
    <div class="card-translation-row">
      <div class="card-flag">🇷🇺</div>
      <div class="card-translation">${c.translation}</div>
    </div>
    <div class="card-example">
      <span class="quote">"</span>${hl(c.example,c.highlight,c.accent)}
    </div>
  </div>`;
}

function verbCard(c) {
  return `<div class="card" style="--accent:${c.accent}">
    <div class="card-header">
      <div class="card-label">
        <div class="card-label-icon" style="font-size:16px;font-weight:900">↻</div>
        IRREGULAR VERB
      </div>
      <div class="card-number">${c.number}</div>
    </div>
    <div class="verb-forms">
      <div class="verb-form-cell">
        <div class="verb-form-box">${c.infinitive}</div>
        <div class="verb-form-label">infinitive</div>
      </div>
      <div class="verb-form-cell">
        <div class="verb-form-box accent">${c.pastSimple}</div>
        <div class="verb-form-label">past simple</div>
      </div>
      <div class="verb-form-cell">
        <div class="verb-form-box">${c.pastParticiple}</div>
        <div class="verb-form-label">participle</div>
      </div>
    </div>
    <div class="dots-row">
      <div class="dot"></div><div class="dot-line"></div>
      <div class="dot"></div><div class="dot-line"></div>
      <div class="dot"></div>
    </div>
    <div class="card-translation-row">
      <div class="card-flag">🇷🇺</div>
      <div class="card-translation">${c.translation}</div>
    </div>
    <div class="card-example">
      <span class="quote">"</span>${hl(c.example,c.highlight,c.accent)}
    </div>
  </div>`;
}

const grid = document.getElementById('grid');
[...vocabularyCards,...irregularVerbCards].forEach(c=>{
  const div = document.createElement('div');
  div.innerHTML = c.type==='vocabulary' ? vocabCard(c) : verbCard(c);
  grid.appendChild(div.firstElementChild);
});
</script>
</body>
</html>
