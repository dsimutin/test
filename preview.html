<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter','SF Pro Display','-apple-system','BlinkMacSystemFont','sans-serif'] },
        boxShadow: { card: '0 18px 45px rgba(15,23,42,0.12), 0 4px 12px rgba(15,23,42,0.06)' }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Inter', sans-serif; }
  .card { width: 380px; height: 520px; }
  @media (max-width: 480px) { .card { width: 320px; height: 460px; } }
</style>
</head>
<body class="min-h-screen bg-[#F6F4EF] px-6 py-12">

<div class="mx-auto max-w-[1280px]">
  <div class="mb-10">
    <h1 class="text-4xl font-extrabold tracking-tight text-slate-950">Study Flashcards</h1>
    <p class="mt-2 text-lg text-slate-500">Vocabulary and irregular verb cards for English learning bot.</p>
  </div>

  <div id="grid" class="grid grid-cols-1 gap-8 sm:grid-cols-2 xl:grid-cols-3 justify-items-center"></div>
</div>

<script>
const vocabularyCards = [
  { type:"vocabulary", number:"01", word:"improve",      transcription:"/ɪmˈpruːv/",         translation:"улучшать",                        example:"I want to improve my speaking.",       highlight:"improve",      accent:"#2F7D5B" },
  { type:"vocabulary", number:"02", word:"conversation", transcription:"/ˌkɒnvəˈseɪʃən/",    translation:"разговор",                        example:"This conversation is interesting.",    highlight:"conversation", accent:"#2F6FD6" },
  { type:"vocabulary", number:"03", word:"stressful",    transcription:"/ˈstresfəl/",         translation:"стрессовый / напряжённый",        example:"My morning is sometimes stressful.",  highlight:"stressful",    accent:"#7A4FB3" },
];

const irregularVerbCards = [
  { type:"irregular", number:"01", infinitive:"come", pastSimple:"came", pastParticiple:"come", translation:"приходить / приезжать",                   example:"I came home late.",                 highlight:"came", accent:"#2F7D5B" },
  { type:"irregular", number:"02", infinitive:"do",   pastSimple:"did",  pastParticiple:"done", translation:"делать",                                   example:"I did my homework yesterday.",      highlight:"did",  accent:"#2F6FD6" },
  { type:"irregular", number:"03", infinitive:"get",  pastSimple:"got",  pastParticiple:"got",  translation:"получать / добираться / становиться",      example:"I got home at 7.",                  highlight:"got",  accent:"#7A4FB3" },
];

function hex(color, alpha) {
  const r = parseInt(color.slice(1,3),16);
  const g = parseInt(color.slice(3,5),16);
  const b = parseInt(color.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function highlightWord(text, word, accent) {
  const regex = new RegExp(`(${word})`, 'gi');
  return text.replace(regex, `<span style="color:${accent};font-weight:700">$1</span>`);
}

function cardShell(content, accent) {
  return `
    <div class="card relative flex flex-col rounded-[32px] bg-white p-8 shadow-card ring-1 ring-black/5"
         style="border-top: 5px solid ${accent}">
      ${content}
    </div>`;
}

function cardHeader(label, number, accent, icon) {
  return `
    <div class="mb-6 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-full text-base"
             style="background:${hex(accent,0.1)};color:${accent}">${icon}</div>
        <span class="text-[11px] font-bold uppercase tracking-[0.2em]" style="color:${accent}">${label}</span>
      </div>
      <div class="rounded-xl px-3 py-1.5 text-sm font-bold"
           style="background:${hex(accent,0.08)};color:${accent}">${number}</div>
    </div>`;
}

function exampleBlock(example, highlight, accent) {
  return `
    <div class="mt-auto rounded-2xl px-5 py-4 text-[18px] leading-snug text-slate-700"
         style="background:${hex(accent,0.07)}">
      <span class="mr-1 text-2xl opacity-40">"</span>${highlightWord(example, highlight, accent)}
    </div>`;
}

function renderVocabularyCard(card) {
  const content = `
    ${cardHeader("VOCABULARY", card.number, card.accent, "📖")}
    <div class="mb-4">
      <h2 class="text-[52px] font-extrabold leading-none tracking-[-0.03em] text-slate-950">${card.word}</h2>
      <div class="mt-4 h-[2px] w-full rounded-full" style="background:${hex(card.accent,0.35)}"></div>
      <div class="mt-4 text-[26px] font-medium" style="color:${card.accent}">${card.transcription}</div>
    </div>
    <div class="my-4 flex items-center gap-3 border-y border-slate-100 py-4">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-lg"
           style="background:${hex(card.accent,0.08)}">🇷🇺</div>
      <div class="text-[26px] font-semibold leading-tight text-slate-900">${card.translation}</div>
    </div>
    ${exampleBlock(card.example, card.highlight, card.accent)}`;
  return cardShell(content, card.accent);
}

function renderIrregularVerbCard(card) {
  const forms = [
    { form: card.infinitive,     label: "infinitive",       highlight: false },
    { form: card.pastSimple,     label: "past simple",      highlight: true  },
    { form: card.pastParticiple, label: "past participle",  highlight: false },
  ];
  const formsCols = forms.map(f => `
    <div class="text-center">
      <div class="rounded-2xl py-3 px-2 text-[28px] font-extrabold leading-none"
           style="background:${hex(card.accent,0.1)};color:${f.highlight ? card.accent : '#0F172A'}">
        ${f.form}
      </div>
      <div class="mt-2 text-[10px] font-bold uppercase tracking-[0.12em] text-slate-400">${f.label}</div>
    </div>`).join('');

  const dotsRow = `
    <div class="mt-5 flex items-center justify-between px-4">
      <span class="h-2 w-2 rounded-full" style="background:${card.accent}"></span>
      <div class="h-px flex-1 bg-slate-200 mx-2"></div>
      <span class="h-2 w-2 rounded-full" style="background:${card.accent}"></span>
      <div class="h-px flex-1 bg-slate-200 mx-2"></div>
      <span class="h-2 w-2 rounded-full" style="background:${card.accent}"></span>
    </div>`;

  const content = `
    ${cardHeader("IRREGULAR VERB", card.number, card.accent, "↻")}
    <div class="mb-4">
      <div class="grid grid-cols-3 gap-2">${formsCols}</div>
      ${dotsRow}
    </div>
    <div class="my-4 flex items-center gap-3 border-y border-slate-100 py-4">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-lg"
           style="background:${hex(card.accent,0.08)}">🇷🇺</div>
      <div class="text-[22px] font-semibold leading-tight text-slate-900">${card.translation}</div>
    </div>
    ${exampleBlock(card.example, card.highlight, card.accent)}`;
  return cardShell(content, card.accent);
}

const grid = document.getElementById('grid');
[...vocabularyCards, ...irregularVerbCards].forEach(card => {
  const div = document.createElement('div');
  div.innerHTML = card.type === 'vocabulary'
    ? renderVocabularyCard(card)
    : renderIrregularVerbCard(card);
  grid.appendChild(div);
});
</script>
</body>
</html>
